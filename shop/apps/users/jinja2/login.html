{% extends 'main/base.html' %}


{% block title %}Black Shop - Login{% endblock title %}

{% block content %}
    <div class="login-container d-flex justify-content-center">
        <div class="login d-flex flex-column">
            <h3 class="text-center mt-5 mb-5">Login</h3>
            <form method="post" class="loginform">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="loginbtns d-flex justify-content-between align-items-center">
                    <button type="submit" class="default-btn mt-2">Login</button>
                    <!-- тут ссылка на register почему-то -->
                    <a href="#" class="create-account-btn">No account?</a>
                </div>
            </form>
        </div>
    </div>
{% endblock content %}
