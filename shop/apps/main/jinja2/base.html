<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Black Shop{% endblock title %}</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <link
      rel="stylesheet"
      href="{{ static('bootstrap/css/bootstrap.min.css') }}"
    />
    <link rel="stylesheet" href="{{ static('css/base.css') }}" />
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header class="header sticky-top d-flex align-items-center">
      <a class="header-logo" href="{{ url('main:catalog') }}">
        <img src="{{ static('img/rev.png') }}" alt="" />
      </a>
      {#
      <div class="search">
        <form
          action=""
          id="search-form"
          class="search_form d-flex"
          style="display: none"
        >
          <input type="text" name="q" class="form_input" placeholder="Search" />
          <button type="submit" class="btnforsearch"></button>
        </form>
      </div>
      #}
      <div class="header-nav d-flex gap-4">
        <a href="#" class="h-profile" aria-label="Профиль">
          <img src="{{ static('img/profile.png') }}" alt="" />
        </a>
        <a href="#" class="h-profile">
          <img src="{{ static('img/cart.png') }}" alt="" />
        </a>
        <div class="forsearch">
          <a href="#" id="toggle-search" class="toggle-search">
            <img src="{{ static('img/search.png') }}" alt="" />
          </a>
          <div class="search-popup" id="search-popup" style="display: none">
            <form
              class="search-form"
              method="GET"
              action="{{ url('main:catalog') }}"
              id="search-form"
            >
              <div class="input-container">
                <input
                  type="text"
                  class="form_input"
                  name="q"
                  placeholder="Search"
                  value="{{ search_query }}"
                />
                <button type="submit" class="btnforsearch"></button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </header>

    <div class="container">{% block content %}{% endblock content %}</div>

    <script>
      const toggleSearch = document.getElementById('toggle-search')
      const searchPopup = document.getElementById('search-popup')

      if (toggleSearch && searchPopup) {
        toggleSearch.addEventListener('click', function (event) {
          event.preventDefault()
          searchPopup.style.display =
            searchPopup.style.display === 'none' ||
            searchPopup.style.display === ''
              ? 'block'
              : 'none'
        })
      }
    </script>

    <script src="{{ static('bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
